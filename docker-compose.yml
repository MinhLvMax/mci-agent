services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro  # Chỉ chạy lần đầu khi volume pgdata còn trống
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: mci-agent:latest
    restart: unless-stopped
    command: uvicorn src.entries_point.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AGENT_ROOT_WORKSPACE: /data/workspace
    volumes:
      - workspace:/data/workspace
      - ./logs/api:/app/logs
    depends_on:
      db:
        condition: service_healthy

  ui:
#    build: .
    image: mci-agent:latest
    restart: unless-stopped
    command: streamlit run src/entries_point/web_ui.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000  # Streamlit gọi API từ phía server, qua mạng nội bộ Docker
      AGENT_ROOT_WORKSPACE: /data/workspace
    volumes:
      - ./logs/ui:/app/logs
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - ui

  adminer:
    image: adminer
    ports:
      - "127.0.0.1:8080:8080"   # chỉ server tự truy cập được, bên ngoài không vào được
    depends_on:
      - db

volumes:
  pgdata:
  workspace:
  caddy_data:
